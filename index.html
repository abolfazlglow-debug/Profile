<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AHOORA — A modern personal portfolio showcasing frontend development, UI/UX skills, creative projects, and digital experiences." />
    <meta name="keywords" content="AHOORA, Frontend Developer, UI/UX Enthusiast, Portfolio, Web Design, JavaScript, React, Web Developer" />
    <meta name="author" content="AHOORA" />
    <meta name="theme-color" content="#11161D" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="AHOORA | Frontend Developer & UI/UX Enthusiast" />
    <meta property="og:description" content="Turning ideas into meaningful digital experiences. Explore selected projects, skills, and expertise." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ahoora.dev" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=1200" />

    <title>AHOORA | Frontend Developer & UI/UX Enthusiast</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ==========================================================================
           AHOORA — Personal Brand Portfolio Stylesheet
           ========================================================================== */

        :root {
            --bg-primary: #11161D;
            --bg-secondary: #181E26;
            --bg-tertiary: #1F2732;
            --bg-glass: rgba(24, 30, 38, 0.75);

            --gold: #C8A96B;
            --gold-light: #D8BD83;
            --gold-dark: #9E8144;
            --gold-glow: rgba(200, 169, 107, 0.25);
            --gold-border: rgba(200, 169, 107, 0.25);

            --text-primary: #F5F3EE;
            --text-secondary: #A8ADB5;
            --text-muted: #6C727F;

            --border-subtle: rgba(255, 255, 255, 0.08);

            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-fa: 'Vazirmatn', Tahoma, sans-serif;

            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-slow: 0.7s cubic-bezier(0.16, 1, 0.3, 1);

            --header-height: 80px;
            --container-max-width: 1200px;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        /* Royal Green Light Theme */
        html[data-theme="royal-light"] {
            --bg-primary: #F7FAF6;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #EEF4EE;
            --bg-glass: rgba(255, 255, 255, 0.78);

            --gold: #176B45;
            --gold-light: #0F5A3A;
            --gold-dark: #0A432B;
            --gold-glow: rgba(23, 107, 69, 0.16);
            --gold-border: rgba(23, 107, 69, 0.22);

            --text-primary: #173025;
            --text-secondary: #52645B;
            --text-muted: #7C8C84;

            --border-subtle: rgba(23, 107, 69, 0.12);
        }

        html[data-theme="royal-light"] body {
            background:
                radial-gradient(circle at 10% 5%, rgba(23, 107, 69, 0.08), transparent 28%),
                radial-gradient(circle at 90% 85%, rgba(23, 107, 69, 0.06), transparent 30%),
                var(--bg-primary);
        }

        *, *::before, *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-weight: 400;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        html[lang="fa"] body {
            font-family: var(--font-fa);
        }

        ::selection {
            background-color: var(--gold);
            color: var(--bg-primary);
        }

        .container {
            width: 100%;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section {
            padding: 7rem 0;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-subtitle {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold);
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 2.75rem;
            font-weight: 700;
            color: var(--text-primary);
            position: relative;
            display: inline-block;
        }

        .section-title-line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 1rem auto 0 auto;
        }

        /* Header & Navigation */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            z-index: 1000;
            transition: all var(--transition-smooth);
            display: flex;
            align-items: center;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .header.scrolled {
            height: 70px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold-light);
            display: flex;
            align-items: center;
        }

        .nav-list {
            display: flex;
            align-items: center;
            gap: 2.5rem;
            list-style: none;
        }

        .nav-link {
            font-size: 0.925rem;
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
            padding: 0.25rem 0;
            text-decoration: none;
        }

        .nav-link:hover, .nav-link.active {
            color: var(--gold-light);
        }

        .lang-toggle, .theme-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 34px;
            padding: 0 0.9rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--gold-border);
            color: var(--gold-light);
            font-size: 0.85rem;
            font-weight: 600;
            cursor: pointer;
            background: transparent;
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: calc(var(--header-height) + 2rem);
        }

        .hero-container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
            align-items: center;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1rem;
            color: var(--text-primary);
        }

        .profile-image-container {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, var(--gold) 0%, rgba(200, 169, 107, 0.1) 100%);
            box-shadow: 0 0 50px rgba(200, 169, 107, 0.2);
            margin: 0 auto;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--bg-primary);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.9rem 2rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 500;
            text-decoration: none;
            cursor: pointer;
            transition: all var(--transition-smooth);
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--bg-primary);
            font-weight: 600;
        }
    </style>
</head>
<body>
    <header class="header" id="header">
        <div class="container header-container">
            <a href="#home" class="logo">AHOORA<span class="logo-dot">.</span></a>
            <nav class="nav" id="nav-menu">
                <ul class="nav-list">
                    <li><a href="#home" class="nav-link active" data-en="Home" data-fa="خانه">Home</a></li>
                    <li><a href="#about" class="nav-link" data-en="About" data-fa="درباره من">About</a></li>
                </ul>
            </nav>
            <button class="lang-toggle" id="lang-toggle" type="button">FA</button>
            <button class="theme-toggle" id="theme-toggle" type="button">◐</button>
        </div>
    </header>

    <main>
        <section class="hero section" id="home">
            <div class="container hero-container">
                <div class="hero-content">
                    <h1 class="hero-title">AHOORA</h1>
                    <p class="hero-description" data-en="Frontend Developer &amp; UI/UX Enthusiast" data-fa="توسعه‌دهنده فرانت‌اند و علاقه‌مند به UI/UX">Frontend Developer &amp; UI/UX Enthusiast</p>
                    <a href="#about" class="btn btn-primary" data-en="Explore More" data-fa="بیشتر بدانید">Explore More</a>
                </div>
                <div class="hero-visual">
                    <div class="profile-image-container">
                        <img src="IMG_20260731_154206_compressed.jpg" class="profile-img" alt="Profile" />
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        // اسکریپت امنیتی بازدارنده پیشرفته برای جلوگیری از بررسی کدهای سورس
        document.addEventListener('contextmenu', e => e.preventDefault());
        document.addEventListener('keydown', e => {
            if (e.key === 'F12' || (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key)) || (e.ctrlKey && e.key === 'u')) {
                e.preventDefault();
                return false;
            }
        });

        // تغییر زبان ساده و تعاملی
        const langToggle = document.getElementById('lang-toggle');
        let currentLang = 'en';
        langToggle.addEventListener('click', () => {
            currentLang = currentLang === 'en' ? 'fa' : 'en';
            document.documentElement.setAttribute('lang', currentLang);
            document.documentElement.setAttribute('dir', currentLang === 'fa' ? 'rtl' : 'ltr');
            langToggle.textContent = currentLang === 'fa' ? 'EN' : 'FA';
            
            document.querySelectorAll('[data-en]').forEach(el => {
                el.textContent = el.getAttribute(`data-${currentLang}`);
            });
        });

        // تغییر تم
        const themeToggle = document.getElementById('theme-toggle');
        themeToggle.addEventListener('click', () => {
            const currentTheme = document.documentElement.getAttribute('data-theme');
            document.documentElement.setAttribute('data-theme', currentTheme === 'royal-light' ? 'dark' : 'royal-light');
        });
    </script>
</body>
</html>
