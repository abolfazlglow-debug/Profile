<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="AHOORA — A modern personal portfolio showcasing frontend development, UI/UX skills, creative projects, and digital experiences." />
    <meta name="keywords" content="AHOORA, Frontend Developer, UI/UX Enthusiast, Portfolio, Web Design, JavaScript, React, Web Developer" />
    <meta name="author" content="AHOORA" />
    <meta name="theme-color" content="#11161D" />

    <!-- Open Graph / Social Media -->
    <meta property="og:title" content="AHOORA | Frontend Developer & UI/UX Enthusiast" />
    <meta property="og:description" content="Turning ideas into meaningful digital experiences. Explore selected projects, skills, and expertise." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://ahoora.dev" />
    <meta property="og:image" content="https://images.unsplash.com/photo-1507003211169-0a1dd7228f2d?auto=format&fit=crop&q=80&w=1200" />

    <title>AHOORA | Frontend Developer & UI/UX Enthusiast</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;1,400&family=Vazirmatn:wght@400;500;600;700&display=swap" rel="stylesheet" />

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" />

    <style>
        /* ==========================================================================
           AHOORA — Personal Brand Portfolio Stylesheet
           ========================================================================== */

        :root {
            --bg-primary: #11161D;
            --bg-secondary: #181E26;
            --bg-tertiary: #1F2732;
            --bg-glass: rgba(24, 30, 38, 0.75);

            --gold: #C8A96B;
            --gold-light: #D8BD83;
            --gold-dark: #9E8144;
            --gold-glow: rgba(200, 169, 107, 0.25);
            --gold-border: rgba(200, 169, 107, 0.25);

            --text-primary: #F5F3EE;
            --text-secondary: #A8ADB5;
            --text-muted: #6C727F;

            --border-subtle: rgba(255, 255, 255, 0.08);

            --font-heading: 'Playfair Display', Georgia, serif;
            --font-body: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            --font-fa: 'Vazirmatn', Tahoma, sans-serif;

            --transition-fast: 0.2s cubic-bezier(0.4, 0, 0.2, 1);
            --transition-smooth: 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            --transition-slow: 0.7s cubic-bezier(0.16, 1, 0.3, 1);

            --header-height: 80px;
            --container-max-width: 1200px;
            --radius-sm: 6px;
            --radius-md: 12px;
            --radius-lg: 20px;
            --radius-full: 9999px;
        }

        /* Royal Green Light Theme */
        html[data-theme="royal-light"] {
            --bg-primary: #F7FAF6;
            --bg-secondary: #FFFFFF;
            --bg-tertiary: #EEF4EE;
            --bg-glass: rgba(255, 255, 255, 0.78);

            --gold: #176B45;
            --gold-light: #0F5A3A;
            --gold-dark: #0A432B;
            --gold-glow: rgba(23, 107, 69, 0.16);
            --gold-border: rgba(23, 107, 69, 0.22);

            --text-primary: #173025;
            --text-secondary: #52645B;
            --text-muted: #7C8C84;

            --border-subtle: rgba(23, 107, 69, 0.12);
        }

        html[data-theme="royal-light"] body {
            background:
                radial-gradient(circle at 10% 5%, rgba(23, 107, 69, 0.08), transparent 28%),
                radial-gradient(circle at 90% 85%, rgba(23, 107, 69, 0.06), transparent 30%),
                var(--bg-primary);
        }

        html[data-theme="royal-light"] .bg-glow-1 {
            background: radial-gradient(circle, rgba(23, 107, 69, 0.28) 0%, transparent 70%);
            opacity: 0.12;
        }

        html[data-theme="royal-light"] .bg-glow-2 {
            background: radial-gradient(circle, rgba(78, 129, 102, 0.18) 0%, transparent 70%);
            opacity: 0.10;
        }

        html[data-theme="royal-light"] .bg-grid-pattern {
            background-image: radial-gradient(rgba(23, 107, 69, 0.08) 1px, transparent 1px);
        }

        html[data-theme="royal-light"] .header.scrolled {
            box-shadow: 0 10px 30px rgba(23, 107, 69, 0.08);
        }

        html[data-theme="royal-light"] .project-overlay {
            background: rgba(10, 67, 43, 0.68);
        }

        html[data-theme="royal-light"] .modal-overlay {
            background: rgba(23, 48, 37, 0.55);
        }

        html[data-theme="royal-light"] .profile-image-container {
            box-shadow: 0 0 50px rgba(23, 107, 69, 0.15);
        }

        html[data-theme="royal-light"] .profile-img {
            border-color: var(--bg-primary);
        }

        html[data-theme="royal-light"] .form-input::placeholder {
            color: #91A098;
        }

        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            scroll-behavior: smooth;
            font-size: 16px;
            text-size-adjust: 100%;
        }

        body {
            background-color: var(--bg-primary);
            color: var(--text-primary);
            font-family: var(--font-body);
            font-weight: 400;
            line-height: 1.6;
            overflow-x: hidden;
            position: relative;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
        }

        html[lang="fa"] body {
            font-family: var(--font-fa);
        }

        html[lang="fa"] .hero-title,
        html[lang="fa"] .logo,
        html[lang="fa"] .footer-logo {
            font-family: var(--font-fa);
        }

        ::selection {
            background-color: var(--gold);
            color: var(--bg-primary);
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--gold-dark);
        }

        ul {
            list-style: none;
        }

        a {
            color: inherit;
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        img {
            max-width: 100%;
            height: auto;
            display: block;
        }

        button,
        input,
        textarea {
            font-family: inherit;
            font-size: inherit;
            color: inherit;
            border: none;
            outline: none;
            background: none;
        }

        button {
            cursor: pointer;
        }

        a:focus-visible,
        button:focus-visible,
        input:focus-visible,
        textarea:focus-visible {
            outline: 2px solid var(--gold);
            outline-offset: 3px;
        }

        /* Background Effects */
        .bg-glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(140px);
            z-index: -2;
            pointer-events: none;
            opacity: 0.15;
        }

        .bg-glow-1 {
            top: -10%;
            left: -10%;
            width: 50vw;
            height: 50vw;
            background: radial-gradient(circle, var(--gold) 0%, transparent 70%);
        }

        .bg-glow-2 {
            bottom: -10%;
            right: -10%;
            width: 60vw;
            height: 60vw;
            background: radial-gradient(circle, #2A3647 0%, transparent 70%);
        }

        .bg-grid-pattern {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
            background-image: radial-gradient(rgba(200, 169, 107, 0.05) 1px, transparent 1px);
            background-size: 32px 32px;
            pointer-events: none;
        }

        /* Layout Utilities */
        .container {
            width: 100%;
            max-width: var(--container-max-width);
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        .section {
            padding: 7rem 0;
            position: relative;
        }

        .section-header {
            text-align: center;
            margin-bottom: 4rem;
        }

        .section-subtitle {
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            color: var(--gold);
            font-weight: 600;
            display: block;
            margin-bottom: 0.5rem;
        }

        .section-title {
            font-family: var(--font-heading);
            font-size: 2.75rem;
            font-weight: 700;
            color: var(--text-primary);
            position: relative;
            display: inline-block;
        }

        html[lang="fa"] .section-title {
            font-family: var(--font-fa);
        }

        .section-title-line {
            width: 60px;
            height: 2px;
            background: linear-gradient(90deg, transparent, var(--gold), transparent);
            margin: 1rem auto 0 auto;
        }

        /* Buttons */
        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            padding: 0.9rem 2rem;
            border-radius: var(--radius-full);
            font-size: 0.95rem;
            font-weight: 500;
            letter-spacing: 0.5px;
            transition: all var(--transition-smooth);
            position: relative;
            overflow: hidden;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--gold) 0%, var(--gold-dark) 100%);
            color: var(--bg-primary);
            font-weight: 600;
            box-shadow: 0 4px 15px rgba(200, 169, 107, 0.2);
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 25px rgba(200, 169, 107, 0.4);
            color: var(--bg-primary);
        }

        .btn-secondary {
            background: transparent;
            color: var(--text-primary);
            border: 1px solid var(--gold-border);
        }

        .btn-secondary:hover {
            background: rgba(200, 169, 107, 0.1);
            border-color: var(--gold);
            transform: translateY(-3px);
            color: var(--gold-light);
        }

        /* Header & Navigation */
        .header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: var(--header-height);
            z-index: 1000;
            transition: all var(--transition-smooth);
            display: flex;
            align-items: center;
        }

        .header-container {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1.5rem;
        }

        .header.scrolled {
            height: 70px;
            background: var(--bg-glass);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border-bottom: 1px solid var(--border-subtle);
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .logo {
            font-family: var(--font-heading);
            font-size: 1.75rem;
            font-weight: 700;
            letter-spacing: 2px;
            color: var(--gold-light);
            display: flex;
            align-items: center;
        }

        .nav-list {
            display: flex;
            align-items: center;
            gap: 2.5rem;
        }

        .nav-link {
            font-size: 0.925rem;
            font-weight: 500;
            color: var(--text-secondary);
            position: relative;
            padding: 0.25rem 0;
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 0%;
            height: 2px;
            background-color: var(--gold);
            transition: width var(--transition-fast);
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--gold-light);
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }

        .lang-toggle {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 44px;
            height: 34px;
            padding: 0 0.9rem;
            border-radius: var(--radius-full);
            border: 1px solid var(--gold-border);
            color: var(--gold-light);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.5px;
            transition: all var(--transition-fast);
            flex-shrink: 0;
        }

        .lang-toggle:hover {
            background: rgba(200, 169, 107, 0.12);
            border-color: var(--gold);
        }

        /* Hero Section */
        .hero {
            min-height: 100vh;
            display: flex;
            align-items: center;
            padding-top: calc(var(--header-height) + 2rem);
            position: relative;
        }

        .hero-container {
            display: grid;
            grid-template-columns: 1.2fr 0.8fr;
            gap: 3rem;
            align-items: center;
        }

        .hero-title {
            font-family: var(--font-heading);
            font-size: 4.5rem;
            font-weight: 700;
            line-height: 1.1;
            margin-bottom: 1rem;
            background: linear-gradient(180deg, var(--text-primary) 0%, var(--text-secondary) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .profile-image-container {
            width: 320px;
            height: 320px;
            border-radius: 50%;
            padding: 8px;
            background: linear-gradient(135deg, var(--gold) 0%, rgba(200, 169, 107, 0.1) 100%);
            box-shadow: 0 0 50px rgba(200, 169, 107, 0.2);
            position: relative;
            z-index: 2;
            animation: floatAnimation 6s ease-in-out infinite;
        }

        .profile-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            border-radius: 50%;
            border: 3px solid var(--bg-primary);
        }

        @keyframes floatAnimation {
            0%,
            100% {
                transform: translateY(0px);
            }
            50% {
                transform: translateY(-12px);
            }
        }

        .hero-greeting {
            display: inline-block;
            color: var(--gold);
            font-size: 0.95rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 1rem;
        }

        .hero-typewriter-container {
            font-size: 1.5rem;
            color: var(--text-secondary);
            margin-bottom: 1.5rem;
            min-height: 2rem;
        }

        .typewriter-text {
            color: var(--gold-light);
            font-weight: 600;
        }

        .typewriter-cursor {
            color: var(--gold);
            animation: blink 1s step-end infinite;
        }

        @keyframes blink {
            50% {
                opacity: 0;
            }
        }

        .hero-tagline {
            font-family: var(--font-heading);
            font-style: italic;
            font-size: 1.2rem;
            color: var(--text-primary);
            margin-bottom: 1rem;
        }

        .hero-description {
            color: var(--text-secondary);
            max-width: 540px;
            margin-bottom: 2rem;
        }

        .hero-cta {
            display: flex;
            gap: 1rem;
            flex-wrap: wrap;
        }

        .profile-frame-wrapper {
            position: relative;
            width: 320px;
            height: 320px;
            margin: 0 auto;
        }

        .profile-geometric-ring,
        .profile-geometric-ring-2 {
            position: absolute;
            border: 1px solid var(--gold-border);
            border-radius: 50%;
            pointer-events: none;
        }

        .profile-geometric-ring {
            inset: -20px;
        }
        .profile-geometric-ring-2 {
            inset: -40px;
            opacity: 0.5;
        }

        /* Mobile Navigation */
        .nav-toggle {
            display: none;
            flex-direction: column;
            justify-content: center;
            gap: 5px;
            width: 32px;
            height: 32px;
            flex-shrink: 0;
        }

        .hamburger-bar {
            display: block;
            width: 100%;
            height: 2px;
            background: var(--text-primary);
            transition: all var(--transition-fast);
        }

        .nav-toggle.open .hamburger-bar:nth-child(1) {
            transform: translateY(7px) rotate(45deg);
        }
        .nav-toggle.open .hamburger-bar:nth-child(2) {
            opacity: 0;
        }
        .nav-toggle.open .hamburger-bar:nth-child(3) {
            transform: translateY(-7px) rotate(-45deg);
        }

        @media (max-width: 768px) {
            .nav-toggle {
                display: flex;
            }
            .nav {
                position: fixed;
                top: var(--header-height);
                left: 0;
                width: 100%;
                background: var(--bg-glass);
                backdrop-filter: blur(16px);
                max-height: 0;
                overflow: hidden;
                transition: max-height var(--transition-smooth);
            }
            .nav.open {
                max-height: 400px;
            }
            .nav-list {
                flex-direction: column;
                align-items: flex-start;
                gap: 0;
                padding: 1rem 1.5rem 1.5rem;
            }
            .nav-item {
                width: 100%;
                padding: 0.6rem 0;
            }
        }

        /* Animations */
        .reveal-up,
        .reveal-left,
        .reveal-right {
            opacity: 0;
            transition: opacity var(--transition-slow), transform var(--transition-slow);
        }

        .reveal-up {
            transform: translateY(30px);
        }
        .reveal-left {
            transform: translateX(-30px);
        }
        .reveal-right {
            transform: translateX(30px);
        }

        .reveal-active {
            opacity: 1;
            transform: translate(0, 0);
        }

        /* About Section */
        .about-grid {
            display: grid;
            grid-template-columns: 1.4fr 1fr;
            gap: 3.5rem;
            align-items: start;
        }

        .about-heading {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            margin-bottom: 1.2rem;
            color: var(--text-primary);
        }

        .about-paragraph {
            color: var(--text-secondary);
            margin-bottom: 1.1rem;
        }

        .about-highlights {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.9rem;
            margin-top: 1.5rem;
        }

        .highlight-item {
            display: flex;
            align-items: center;
            gap: 0.6rem;
            font-size: 0.9rem;
            color: var(--text-primary);
        }

        .highlight-icon {
            color: var(--gold);
            flex-shrink: 0;
        }

        .about-stats {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
        }

        .stat-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 1.5rem 1.75rem;
        }

        .stat-number {
            font-family: var(--font-heading);
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--gold-light);
        }

        .stat-label {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-top: 0.25rem;
        }

        .stat-bar {
            height: 3px;
            background: linear-gradient(90deg, var(--gold), transparent);
            border-radius: var(--radius-full);
            margin-top: 1rem;
        }

        @media (max-width: 992px) {
            .about-grid {
                grid-template-columns: 1fr;
            }
            .about-highlights {
                grid-template-columns: 1fr 1fr;
            }
        }

        /* Skills Section */
        .skills-wrapper {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 3.5rem;
        }

        .skills-category-title {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            margin-bottom: 1.5rem;
            display: flex;
            align-items: center;
            gap: 0.6rem;
        }

        .title-icon {
            color: var(--gold);
        }

        .skills-list {
            display: flex;
            flex-direction: column;
            gap: 1.2rem;
        }

        .skill-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 0.4rem;
            font-size: 0.9rem;
        }

        .skill-percentage {
            color: var(--gold-light);
            font-weight: 600;
        }

        .skill-progress-bg {
            width: 100%;
            height: 6px;
            background: var(--bg-tertiary);
            border-radius: var(--radius-full);
            overflow: hidden;
        }

        .skill-progress-fill {
            height: 100%;
            background: linear-gradient(90deg, var(--gold-dark), var(--gold-light));
            border-radius: var(--radius-full);
            transition: width 1.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .soft-skills-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.25rem;
        }

        .soft-skill-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 1.5rem;
            transition: border-color var(--transition-fast), transform var(--transition-fast);
        }

        .soft-skill-card:hover {
            border-color: var(--gold-border);
            transform: translateY(-4px);
        }

        .soft-skill-icon {
            color: var(--gold);
            font-size: 1.3rem;
            margin-bottom: 0.75rem;
        }

        .soft-skill-card h4 {
            font-size: 1rem;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .soft-skill-card p {
            font-size: 0.85rem;
            color: var(--text-secondary);
            line-height: 1.5;
        }

        @media (max-width: 768px) {
            .skills-wrapper {
                grid-template-columns: 1fr;
            }
            .soft-skills-grid {
                grid-template-columns: 1fr;
            }
        }

        /* Portfolio Section */
        .portfolio-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 2.5rem;
        }

        .project-card {
            background-color: var(--bg-secondary);
            border-radius: var(--radius-md);
            border: 1px solid var(--border-subtle);
            overflow: hidden;
            transition: all var(--transition-smooth);
            cursor: pointer;
        }

        .project-card:hover {
            border-color: var(--gold-border);
            transform: translateY(-8px);
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.4);
        }

        .project-image-wrapper {
            position: relative;
            overflow: hidden;
            aspect-ratio: 16 / 10;
        }

        .project-img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform var(--transition-smooth);
        }

        .project-card:hover .project-img {
            transform: scale(1.06);
        }

        .project-overlay {
            position: absolute;
            inset: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            background: rgba(17, 22, 29, 0.75);
            opacity: 0;
            transition: opacity var(--transition-fast);
        }

        .project-card:hover .project-overlay {
            opacity: 1;
        }

        .btn-sm {
            padding: 0.6rem 1.2rem;
            font-size: 0.85rem;
        }

        .project-content {
            padding: 1.5rem;
            position: relative;
        }

        .project-content .project-number {
            position: absolute;
            top: -2.6rem;
            right: 1.5rem;
            font-family: var(--font-heading);
            font-size: 1.6rem;
            color: var(--gold);
            opacity: 0.5;
        }

        .project-title {
            font-family: var(--font-heading);
            font-size: 1.2rem;
            margin-bottom: 0.5rem;
        }

        .project-description {
            color: var(--text-secondary);
            font-size: 0.9rem;
            margin-bottom: 1rem;
        }

        .project-tags {
            display: flex;
            gap: 0.5rem;
            flex-wrap: wrap;
        }

        .tag {
            font-size: 0.75rem;
            padding: 0.25rem 0.75rem;
            border-radius: var(--radius-full);
            background: var(--bg-tertiary);
            color: var(--gold-light);
            border: 1px solid var(--border-subtle);
        }

        /* Contact Section */
        .contact-wrapper {
            display: grid;
            grid-template-columns: 1fr 1.2fr;
            gap: 3.5rem;
        }

        .contact-heading {
            font-family: var(--font-heading);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        .contact-lead {
            color: var(--text-secondary);
            margin-bottom: 2rem;
        }

        .info-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        .info-item {
            display: flex;
            align-items: center;
            gap: 1rem;
            padding: 0.9rem 1.1rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            transition: border-color var(--transition-fast), transform var(--transition-fast);
        }

        .info-item:hover {
            border-color: var(--gold-border);
            transform: translateY(-2px);
            color: var(--gold-light);
        }

        .info-icon {
            width: 42px;
            height: 42px;
            flex-shrink: 0;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-tertiary);
            color: var(--gold);
        }

        .info-details {
            display: flex;
            flex-direction: column;
        }

        .info-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
        }

        .info-value {
            font-size: 0.95rem;
        }

        .contact-form {
            display: flex;
            flex-direction: column;
            gap: 1.25rem;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-md);
            padding: 2rem;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
            position: relative;
        }

        .form-label {
            font-size: 0.85rem;
            color: var(--text-secondary);
        }

        .form-input {
            padding: 0.8rem 1rem;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-sm);
            transition: border-color var(--transition-fast);
        }

        .form-input:focus {
            border-color: var(--gold);
        }

        .form-textarea {
            resize: vertical;
            min-height: 120px;
        }

        .form-error {
            display: none;
            font-size: 0.8rem;
            color: #E07A6B;
        }

        .form-group.error .form-input {
            border-color: #E07A6B;
        }

        .form-group.error .form-error {
            display: block;
        }

        .form-submit-btn {
            width: 100%;
            margin-top: 0.5rem;
        }

        .form-feedback-message {
            font-size: 0.9rem;
            text-align: center;
            min-height: 1.2rem;
        }

        .form-feedback-message.success {
            color: #7BC47F;
        }

        @media (max-width: 992px) {
            .contact-wrapper {
                grid-template-columns: 1fr;
            }
        }

        /* Footer */
        .footer {
            border-top: 1px solid var(--border-subtle);
            padding: 3rem 0;
        }

        .footer-container {
            display: flex;
            flex-wrap: wrap;
            align-items: center;
            justify-content: space-between;
            gap: 2rem;
        }

        .footer-logo {
            font-family: var(--font-heading);
            font-size: 1.4rem;
            color: var(--gold-light);
            letter-spacing: 2px;
        }

        .footer-tagline {
            color: var(--text-muted);
            font-size: 0.85rem;
            margin-top: 0.5rem;
        }

        .footer-links {
            display: flex;
            flex-wrap: wrap;
            gap: 1.5rem;
        }

        .footer-links a {
            color: var(--text-secondary);
            font-size: 0.9rem;
            transition: color var(--transition-fast);
        }

        .footer-links a:hover {
            color: var(--gold-light);
        }

        .footer-socials {
            display: flex;
            gap: 1rem;
        }

        .footer-socials a {
            width: 38px;
            height: 38px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            transition: all var(--transition-fast);
        }

        .footer-socials a:hover {
            border-color: var(--gold);
            color: var(--gold-light);
            transform: translateY(-3px);
        }

        .footer-copyright {
            width: 100%;
            text-align: center;
            color: var(--text-muted);
            font-size: 0.8rem;
            padding-top: 1.5rem;
            border-top: 1px solid var(--border-subtle);
            margin-top: 1rem;
        }

        /* Portfolio Modal */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(17, 22, 29, 0.85);
            backdrop-filter: blur(6px);
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            z-index: 2000;
            opacity: 0;
            pointer-events: none;
            transition: opacity var(--transition-smooth);
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-container {
            position: relative;
            max-width: 640px;
            width: 100%;
            max-height: 85vh;
            overflow-y: auto;
            background: var(--bg-secondary);
            border: 1px solid var(--border-subtle);
            border-radius: var(--radius-lg);
            padding: 2rem;
        }

        .modal-close-btn {
            position: absolute;
            top: 1.2rem;
            right: 1.2rem;
            width: 36px;
            height: 36px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            background: var(--bg-tertiary);
            z-index: 2;
        }

        .modal-close-btn:hover {
            color: var(--gold-light);
        }

        .modal-image {
            width: 100%;
            border-radius: var(--radius-md);
            margin-bottom: 1.5rem;
            aspect-ratio: 16/9;
            object-fit: cover;
        }

        .modal-title {
            font-family: var(--font-heading);
            font-size: 1.6rem;
            margin: 0.5rem 0 1rem;
        }
